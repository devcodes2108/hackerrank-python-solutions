<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Quick Push workflow banner</title>
  <desc id="desc">An illustrated banner showing code solutions being committed and pushed with Quick Push.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="72" x2="950" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>

  <circle cx="1010" cy="110" r="110" fill="#F59E0B" fill-opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="110" cy="340" r="120" fill="#22D3EE" fill-opacity="0.14" filter="url(#softGlow)"/>

  <g opacity="0.7">
    <path d="M180 85L760 85" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M160 330L880 330" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="120" y="80" width="520" height="260" rx="22" fill="#0B1120" stroke="#1F2937" stroke-width="2"/>
    <rect x="145" y="106" width="150" height="14" rx="7" fill="#374151"/>
    <rect x="145" y="136" width="230" height="12" rx="6" fill="#1F2937"/>
    <rect x="145" y="166" width="200" height="12" rx="6" fill="#1F2937"/>
    <rect x="145" y="196" width="260" height="12" rx="6" fill="#1F2937"/>
    <rect x="145" y="238" width="183" height="54" rx="14" fill="url(#button)"/>
    <text x="188" y="273" font-size="22" font-family="Verdana, Arial, sans-serif" font-weight="700" fill="#03130F">Push</text>
    <g>
      <path d="M450 120L540 120L540 170H450V120Z" fill="#111827" stroke="#374151" stroke-width="2"/>
      <path d="M465 135H525" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
      <path d="M470 156H520" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <g transform="translate(462 210)">
        <circle r="18" fill="#8B5CF6" fill-opacity="0.2"/>
        <path d="M-7 0L0 -7L7 0L0 7L-7 0Z" fill="#8B5CF6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.2s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g>
    <path d="M670 112C760 86 826 92 884 128C931 156 960 198 961 228C962 269 940 311 899 332C853 355 789 360 722 332C647 301 622 246 650 196C671 163 691 138 670 112Z" fill="url(#accent)" fill-opacity="0.12"/>
    <circle cx="758" cy="206" r="74" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
    <path d="M732 206L750 224L790 184" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M858 148C886 172 914 198 944 224" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0 200; 120 80; 0 200" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M874 255C839 282 809 290 777 294" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0 220; 140 80; 0 220" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <text x="120" y="390" font-size="38" font-family="Verdana, Arial, sans-serif" font-weight="700" fill="#F8FAFC">Quick Push</text>
    <text x="472" y="390" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#CBD5E1">committing and pushing every solution</text>
  </g>
</svg>
